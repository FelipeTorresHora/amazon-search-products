name: Frontend CI/CD

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'frontend/**'
      - 'home.py'
      - 'app_utils.py'
      - 'pages/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt

      - name: Run linters
        run: |
          # Code formatting check
          black --check frontend/ || true

          # Linting
          flake8 frontend/ --max-line-length=100 --ignore=E203,W503 || true

      - name: Test Streamlit app
        run: |
          # Validate Streamlit app syntax
          python -m py_compile frontend/app.py || true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/amazon-search-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/amazon-search-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amazon-search-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amazon-search-frontend:buildcache,mode=max
